name: Update news and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: pages-news-update
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install dependencies
        run: npm ci
      - name: Calculate site path
        run: npm exec tsx scripts/page-settings.ts
      - name: Collect and process news
        run: npm run update:news
      - name: Check types
        run: npm run typecheck
      - name: Build production site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
