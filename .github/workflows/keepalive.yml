name: Keep scheduled workflows active

on:
  workflow_dispatch:
  schedule:
    - cron: "31 3 1 * *"

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Update keepalive marker
        shell: bash
        run: date -u +%Y-%m > .github/keepalive
      - name: Commit marker when changed
        shell: bash
        run: |
          if git diff --quiet -- .github/keepalive; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keep scheduled news updates active [skip ci]"
          git push
